[package]
name = "indigo-ffi"
description = "INDIGO for Swift and Kotlin: the wallet facade over UniFFI (demo surface for now)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["staticlib", "lib"]
name = "indigo_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
indigo-core.workspace = true
indigo-domain.workspace = true
indigo-keys.workspace = true
indigo-testnets.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
# The version fedimint-sdk already uses.
uniffi = { version = "0.32", features = ["cli"] }
# Fedimint -> iroh 0.35 -> netwatch 0.5 needs socket2 0.5 "all" but does not enable it.
socket2 = { version = "0.5", features = ["all"] }

# Arkade and Bark's esplora client use reqwest's default native-tls, which is
# OpenSSL on Android. The NDK ships no OpenSSL, so build it from source.
[target.'cfg(target_os = "android")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

# Present only to switch features on (socket2 `all`, OpenSSL vendored).
[package.metadata.cargo-machete]
ignored = ["socket2", "openssl"]
