[package]
edition = "2024"
name = "fedimint-sdk"
version = "0.1.0-beta.1"
authors = ["The Fedimint Developers"]
build = "build.rs"
exclude = ["/AGENTS.md"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "High-level Fedimint client SDK: one ergonomic API over fedimint-client, and the single surface every binding generates from"
homepage = "https://fedimint.org"
readme = "README.md"
keywords = [
    "bitcoin",
    "lightning",
    "e-cash",
    "fedimint",
    "wallet",
]
categories = ["cryptography::cryptocurrencies"]
license = "MIT"
repository = "https://github.com/fedimint/fedimint-sdk"

[features]
uniffi = [
    "dep:uniffi",
    "dep:async-compat",
    "dep:uniffi-runtime-wasm",
]

[lib]
name = "fedimint_sdk"
path = "src/lib.rs"

[[example]]
