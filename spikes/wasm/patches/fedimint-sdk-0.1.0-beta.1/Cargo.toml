path = "examples/ecash.rs"

[[example]]
name = "lightning"
path = "examples/lightning.rs"

[[example]]
name = "onchain"
path = "examples/onchain.rs"

[[example]]
name = "walkthrough"
path = "examples/walkthrough.rs"

[[test]]
