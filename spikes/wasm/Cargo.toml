[package]
name = "spike-wasm"
description = "Phase 0 test 0.9: which protocol SDKs build together for the browser (all but Arkade)."
version = "0.0.0"
edition = "2024"
publish = false

# Own workspace and lockfile: browser feature sets differ from the native ones.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
indigo-testnets = { path = "../../crates/testnets" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
# Same versions as the main workspace, with each SDK's browser features.
cdk = { version = "0.18.2", default-features = false, features = ["wallet"], optional = true }
fedimint-sdk = { version = "=0.1.0-beta.1", optional = true }
bark-wallet = { version = "0.8.0", default-features = false, features = ["wasm-web", "indexed-db"], optional = true }
ark-client = { version = "0.12.0", default-features = false, optional = true }
ark-core = { version = "0.12.0", optional = true }
ark-grpc = { version = "0.12.0", default-features = false, optional = true }
bdk_wallet = { version = "3.2.0", optional = true }
# Browser randomness: getrandom 0.2 and 0.3 each need their own switch.
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

[features]
# Arkade is not a default: its Rust client does not build for browsers (test 0.9).
default = ["cdk", "fedimint", "bark", "bdk"]
cdk = ["dep:cdk"]
fedimint = ["dep:fedimint-sdk"]
bark = ["dep:bark-wallet"]
arkade = ["dep:ark-client", "dep:ark-core", "dep:ark-grpc"]
bdk = ["dep:bdk_wallet"]

# Three wasm-streams versions end up in one module (via reqwest 0.12, fedimint
# and Bark's gRPC-Web client) and each exports the same JS class names, which
# wasm-bindgen 0.2.129 rejects. The two older copies get version-suffixed names.
[patch.crates-io]
wasm-streams = { path = "patches/wasm-streams-0.4.2" }
wasm-streams-05 = { package = "wasm-streams", path = "patches/wasm-streams-0.5.0" }
# fedimint-sdk pins wasm-bindgen =0.2.106; Bark needs js-sys 0.3.85+ (wasm-bindgen
# 0.2.108+). Local copy with the pin relaxed to a normal range.
fedimint-sdk = { path = "patches/fedimint-sdk-0.1.0-beta.1" }

# cargo-machete can't see these uses: bark-wallet's library is named `bark`; the getrandom entries only switch on browser randomness; #[wasm_bindgen] async functions need wasm-bindgen-futures.
[package.metadata.cargo-machete]
ignored = ["bark-wallet", "getrandom02", "getrandom03", "wasm-bindgen-futures"]
